server:
  port: 8080

spring:
  application:
    name: havon-foods-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/havon_foods_db
    username: havon_admin
    password: havon_secret_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

   # Havon Foods Security & JWT Settings
jwt:
